<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducion a flexbox</title>
    <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
<nav class="starbucks-nav">
    <div class="nav-left">
        <img src="src/img/starbucks-logo.png" alt="Logo de starbucks" class="logo">
        <ul class="menu-list">
            <li>MENU</li>
            <li>REWARDS</li>
        </ul>
    </div>

    <div class="nav-right">
        <div class="location">
            <span class="romanesco-regular">📍Localizar Tienda</span>
        </div>
        <button class="btn-login">Ingresar</button>
        <button class="btn-join">Únete</button>
    </div>
</nav>



    <main>
        <section class="hero green-section">
            <div class="content-box">
                <h1>Refresca tu tarde</h1>
                <p>Nuevas bebidas frías para disfrutar el verano.</p>
                <button class="btn-outline-white">Saber más</button>
            </div>
            <div class="image-box">
                <img src="src/img/shaken-black-tea_1.png" alt="Bebida">
            </div>
        </section>

        <section class="hero pink-section reverse">
            <div class="content-box">
                <h1>Tu café, a tu manera</h1>
                <p>Personaliza tus bebidas favoritas desde la app.</p>
                <button class="btn-outline-dark">Personalizar</button>
            </div>
            <div class="image-box">
                <img src="src/img/mocha-blanco-frappuccino_1.png" alt="App">
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <p>&copy; Ⓒ 2025. Starbucks Cofee Company. Reservados todos los derechos</p>
        </div>
    </footer>


</body>
</html>
